# Build + test across the SIMD kernel dispatch targets (mlp_impl_design.ja.md
# I.3): NEON on Apple Silicon, AVX2 and scalar on x86_64 Linux, MSVC/AVX2 on
# Windows (best-effort, design.ja.md 5.9). The kernels test asserts the
# dispatched path is bit-exact with the scalar oracle, so each runner verifies
# its own SIMD path on real hardware.
#
# Two jobs sit outside that matrix: `sanitizers` (ASan + UBSan, the only build
# here with assertions on) and `golden`, which fetches the KyTea model so the
# byte-parity tests actually run instead of skipping themselves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (NEON)
            os: macos-15
            cmake_args: ''
          - name: Linux x86_64 (AVX2)
            os: ubuntu-24.04
            cmake_args: >-
              -DCMAKE_CXX_COMPILER=g++-14
              -DCMAKE_CXX_FLAGS=-mavx2
          - name: Linux x86_64 (scalar)
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # GCC 14 for C++23 (std::print / std::expected); OpenBLAS for the
        # training target (the only place BLAS links, design.ja.md 5.9).
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libopenblas-dev ninja-build

      - name: Install dependencies (macOS)
        run: brew install ninja
        if: runner.os == 'macOS'

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSEGMENTLIB_BUILD_TRAINING=ON
          -DSEGMENTLIB_BUILD_BENCH=OFF
          -DSEGMENTLIB_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ASan + UBSan. The parsers are hand-written over untrusted model bytes, the
  # kernels do unaligned SIMD pointer arithmetic, and the batch path is a
  # lock-free atomic cursor — all of which the Release-only matrix above cannot
  # see. This job is also the only one that builds with assertions enabled.
  sanitizers:
    name: Linux x86_64 (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libopenblas-dev ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=g++-14
          -DSEGMENTLIB_BUILD_TRAINING=ON
          -DSEGMENTLIB_BUILD_BENCH=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=0

  # The golden tests (byte parity with real KyTea, and tokenize_all vs serial)
  # need the 128 MB model, which is gitignored. Without this job they skip
  # themselves in every CI run and report success, so the library's strongest
  # correctness guarantee would go unverified. SEGMENTLIB_REQUIRE_GOLDEN makes a
  # missing model fail instead of skip, so a broken fetch cannot quietly put us
  # back in that state. The model is cached; only a cache miss hits the network.
  golden:
    name: Golden (KyTea byte parity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
      - name: Cache the KyTea model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/kytea
          key: kytea-model-${{ hashFiles('scripts/fetch_kytea_model.sh') }}
      - name: Fetch the KyTea model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: scripts/fetch_kytea_model.sh
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DSEGMENTLIB_BUILD_BENCH=OFF
          -DSEGMENTLIB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          SEGMENTLIB_REQUIRE_GOLDEN: '1'

  # Every other job builds segmentlib as the top-level project, so nothing else
  # here exercises the path a downstream user takes. The rationale and the
  # assertions live in scripts/check_consumer.sh.
  consumer:
    name: Consumer integration (add_subdirectory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
      - name: Check
        run: scripts/check_consumer.sh
        env:
          CXX: g++-14

  # Windows is best-effort (design.ja.md 5.9): MSVC's C++23 coverage is
  # believed sufficient but has never been exercised, so this job reports
  # without blocking the workflow. Training stays off (no easy BLAS); the
  # inference tests — including the AVX2-vs-scalar kernels check under
  # /arch:AVX2 — still run.
  windows:
    name: Windows x86_64 (MSVC, AVX2, best-effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_FLAGS="/arch:AVX2 /utf-8"
          -DSEGMENTLIB_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
